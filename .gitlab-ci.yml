default:
  interruptible: true
  tags:
    - docker

stages:
  - build
  - test

.python_matrix:
  image: sergiud/hogpp:$PYTHON_VERSION
  parallel:
    matrix:
      - PYTHON_VERSION:
          - python3.11
          - python3.12
          - python3.13
          - python3.14
          - pypy3.11

.matching_build:
  needs:
    - job: build
      parallel:
        matrix:
          - PYTHON_VERSION: ['$[[ matrix.PYTHON_VERSION ]]']

.lint:
  stage: test
  allow_failure: true
  needs: []

.compile:
  variables:
    CCACHE_BASEDIR: $CI_PROJECT_DIR
    CCACHE_DIR: $CI_PROJECT_DIR/.cache/
    CMAKE_CXX_COMPILER_LAUNCHER: /usr/bin/ccache
    CXXFLAGS: -fdiagnostics-color --coverage -fuse-ld=mold

build:
  extends: [.python_matrix, .compile]
  stage: build
  before_script:
    - python -m venv .env/
  script:
    - source .env/bin/activate
    - export pybind11_DIR=$(pybind11-config --cmakedir)
    - pip install -r requirements.txt --prefer-binary
    - pip install --no-build-isolation
      --config-settings build-dir=build/
      --config-settings cmake.build-type=Debug
      --verbose
      --editable .
  cache:
    key: ccache-$PYTHON_VERSION
    paths:
      - .cache/
  artifacts:
    expire_in: 1 week
    paths:
      - .env/
      - build/
    exclude:
      - build/**/*.o

docs:
  extends: [.python_matrix, .matching_build]
  stage: build
  script:
    - source .env/bin/activate
    - sphinx-build -M html
      ${CI_PROJECT_DIR}/docs/
      ${CI_PROJECT_DIR}/docs/_build
      -W --keep-going
  artifacts:
    paths:
      - docs/_build/html/

test:
  extends: [.python_matrix, .matching_build]
  stage: test
  script:
    - source .env/bin/activate
    - coverage run -m pytest --junit-xml=report.xml
    - coverage report
    - coverage xml
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml

build:trixie:
  extends: .compile
  image: sergiud/hogpp:trixie
  stage: build
  script:
    - export pybind11_DIR=$(pybind11-config --cmakedir)
    - cmake . -B build/
      -DCMAKE_BUILD_TYPE=Debug
      -DCMAKE_REQUIRE_FIND_PACKAGE_pybind11=ON
      -DCMAKE_REQUIRE_FIND_PACKAGE_Python=ON
      -DCMAKE_REQUIRE_FIND_PACKAGE_Sphinx=ON
      -GNinja
    - cmake --build build/
  cache:
    key: ccache-trixie
    paths:
      - .cache/
  artifacts:
    expire_in: 1 week
    paths:
      - build/
    exclude:
      - build/**/*.o

docs:trixie:
  image: sergiud/hogpp:trixie
  stage: build
  needs:
    - build:trixie
  script:
    - PYTHONPATH=${CI_PROJECT_DIR}/build/
      sphinx-build -M html
      ${CI_PROJECT_DIR}/docs/
      ${CI_PROJECT_DIR}/build/docs/_build/
      -W --keep-going
  artifacts:
    paths:
      - build/docs/

test:trixie:
  image: sergiud/hogpp:trixie
  stage: test
  needs:
    - build:trixie
  script:
    # Run unit tests
    - ctest --test-dir build/
      -C Debug -j$(nproc)
      --output-on-failure
      --output-junit ctest.xml
  after_script:
    # Run coverage
    - cd build/
    - mkdir coverage
    - gcovr -r .. . -s
      --html -o coverage/report.html
      --xml coverage.xml
  coverage: '/lines:\s+(\d+\.\d+|\d+)%/'
  artifacts:
    when: always
    paths:
      - build/coverage
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage.xml
      junit: build/ctest.xml

lint:
  extends: [.python_matrix, .lint]
  script:
    - black --check --diff .
    - flake8 .
    - isort --check-only --diff .

lint:cpp:
  extends: .lint
  image: sergiud/hogpp:lint-23
  script:
    - fdfind -g '*.[ch]pp' -x clang-format-23 --dry-run --Werror

lint:python-typing:
  extends: .lint
  image: sergiud/hogpp:lint-23
  script:
    - mypy --strict python/hogpp/_hogpp.pyi python/hogpp/__init__.pyi
    - ty check python/hogpp/_hogpp.pyi python/hogpp/__init__.pyi
